<svg width="180" height="180" viewBox="0 0 148 148" xmlns="http://www.w3.org/2000/svg">
  <!-- soft backdrop -->
  <circle cx="74" cy="74" r="68" fill="#02569B" opacity="0.06"/>
  <circle cx="74" cy="74" r="68" fill="none" stroke="#02569B" stroke-width="1.5" opacity="0.18">
    <animate attributeName="r" values="60;68;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0.08;0.28" dur="3s" repeatCount="indefinite"/>
